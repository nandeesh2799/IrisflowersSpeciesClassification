[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-classifier"
version = "1.0.0"
description = "Production-grade Iris flower species classification library and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nandeesh N K"}
]
keywords = ["machine-learning", "scikit-learn", "iris", "classification", "cli", "streamlit"]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "streamlit>=1.25.0",
    "python-pptx>=0.6.21",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
iris-cli = "iris_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
