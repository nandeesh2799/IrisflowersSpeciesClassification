name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest -v --cov=iris_classifier tests/

      - name: Verify CLI Smoke Commands
        run: |
          iris-cli info
          iris-cli predict --sepal-length 5.1 --sepal-width 3.5 --petal-length 1.4 --petal-width 0.2
          iris-cli predict --sepal-length 6.5 --sepal-width 3.0 --petal-length 5.5 --petal-width 1.8 --format json
          iris-cli evaluate

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: iris-classifier:latest
